<div class="account-container">
  <div class="content-wrapper">
    <div class="header">
      <div class="icon-container">
        <span class="material-icons-outlined">account_circle</span>
      </div>
      <h2>Account</h2>
      <p>Sign in or create a new account to continue</p>
    </div>

    <div class="action-buttons">
      <button class="btn btn-login" (click)="onLogin()">
        Login
      </button>

      <button class="btn btn-register" (click)="onRegister()">
        Register
      </button>
    </div>

    <div class="terms-text">
      By continuing, you agree to our <span>Terms of Service</span> and <span>Privacy Policy</span>
    </div>
  </div>
</div>
