<div class="login-container">
  <div class="background-overlay"></div>
  
  <button class="back-btn" (click)="goBack()">
    <span class="material-icons-outlined">arrow_back</span>
  </button>

  <div class="login-card-wrapper">
    <div class="login-card">
      <div class="card-header">
        <div class="logo-area">
          <span class="material-icons-outlined">local_parking</span>
        </div>
        <h2>Provider Portal</h2>
        <p>Log in to manage your spaces and earnings</p>
      </div>

      <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="login-form">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-container">
            <span class="material-icons-outlined">alternate_email</span>
            <input 
              type="email" 
              name="email" 
              [(ngModel)]="loginData.email" 
              required 
              placeholder="name@company.com"
            >
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-container">
            <span class="material-icons-outlined">lock_open</span>
            <input 
              type="password" 
              name="password" 
              [(ngModel)]="loginData.password" 
              required 
              placeholder="••••••••"
            >
          </div>
        </div>

        <div class="form-actions">
          <label class="remember-me">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
          </label>
          <a href="javascript:void(0)" class="forgot-link">Help?</a>
        </div>

        <button type="submit" class="btn-submit" [disabled]="!loginForm.form.valid">
          Login to Dashboard
        </button>
      </form>

      <div class="card-footer">
        New provider? <span class="register-link">Get Started</span>
      </div>
    </div>
  </div>
</div>
